apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gwatcho-local
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api-gateway
          image: ghcr.io/guywatcho/gwatcho-api-gateway:develop-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
