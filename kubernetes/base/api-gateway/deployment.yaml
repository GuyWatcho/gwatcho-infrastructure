apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gwatcho-local
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api-gateway
          image: ghcr.io/guywatcho/gwatcho-api-gateway:develop-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
          
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SERVER_PORT
              value: "8085"

            # The JWT issuer must match the issuer in issued tokens.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://localhost:8080/realms/gwatcho-shop

            # Internal pod-to-host access for JWK retrieval.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak:8080/realms/gwatcho-shop/protocol/openid-connect/certs
              
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
