apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: delivery-service-db-secret
  namespace: gwatcho-local
spec:
  destination:
    create: true
    name: delivery-db-secret
    overwrite: false
  hmacSecretData: true
  mount: secret
  path: delivery-service
  refreshAfter: 60s
  type: kv-v2
  vaultAuthRef: delivery-service-vault-auth
