apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: gwatcho-local
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: order-service
          image: ghcr.io/guywatcho/gwatcho-order-service:develop-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SERVER_PORT
              value: "8080"
              
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://host.docker.internal:3309/order_db?serverTimezone=Europe/Berlin"
              
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: SPRING_DATASOURCE_PASSWORD

            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: host.docker.internal:19092

            # The JWT issuer must match the issuer in issued tokens.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://localhost:8080/realms/gwatcho-shop

            # Internal pod-to-host access for JWK retrieval.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://host.docker.internal:8080/realms/gwatcho-shop/protocol/openid-connect/certs

          startupProbe:
            httpGet:
              path: /order-service/actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18

          livenessProbe:
            httpGet:
              path: /order-service/actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /order-service/actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
