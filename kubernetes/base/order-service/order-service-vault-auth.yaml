apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: order-service-vault-auth
  namespace: gwatcho-local
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-local
  kubernetes:
    role: gwatcho-order-service-role
    serviceAccount: vso-order-service
    tokenExpirationSeconds: 600
