
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: order-db-secret
  namespace: gwatcho-local
spec:
  vaultAuthRef: user-service-vault-auth
  mount: secret
  path: order-service
  type: kv-v2
  refreshAfter: 60s
  destination:
    name: order-db-secret
    create: true
