apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: gwatcho-local
  labels:
    app: delivery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: delivery-service
          image: ghcr.io/guywatcho/gwatcho-delivery-service:develop-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://host.docker.internal:3311/delivery_db?serverTimezone=Europe/Berlin
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: delivery-db-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: delivery-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: host.docker.internal:19092
          startupProbe:
            httpGet:
              path: /delivery-service/actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /delivery-service/actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /delivery-service/actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
