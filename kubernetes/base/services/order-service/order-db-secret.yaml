apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: order-db-secret
  namespace: gwatcho-local
spec:
  destination:
    create: false
    name: order-db-secret
    overwrite: false
  hmacSecretData: true
  mount: secret
  path: order-service
  refreshAfter: 60s
  type: kv-v2
  vaultAuthRef: order-service-vault-auth
