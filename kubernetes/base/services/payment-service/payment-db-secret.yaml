apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payment-service-db-secret
  namespace: gwatcho-local
spec:
  destination:
    create: true
    name: payment-db-secret
    overwrite: false
  hmacSecretData: true
  mount: secret
  path: payment-service
  refreshAfter: 60s
  type: kv-v2
  vaultAuthRef: payment-service-vault-auth
