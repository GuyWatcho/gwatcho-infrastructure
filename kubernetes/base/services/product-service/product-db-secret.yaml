apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: product-service-db-secret
  namespace: gwatcho-local
spec:
  destination:
    create: false
    name: product-db-secret
    overwrite: false
  hmacSecretData: true
  mount: secret
  path: product-service
  refreshAfter: 60s
  type: kv-v2
  vaultAuthRef: product-service-vault-auth
