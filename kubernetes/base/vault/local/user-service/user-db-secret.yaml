apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: user-db-secret
  namespace: gwatcho-local
spec:
  destination:
    create: false
    name: user-db-secret
    overwrite: false
  hmacSecretData: true
  mount: secret
  path: user-service
  refreshAfter: 60s
  type: kv-v2
  vaultAuthRef: user-service-vault-auth
