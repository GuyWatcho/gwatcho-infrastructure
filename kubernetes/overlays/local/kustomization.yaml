apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gwatcho-local

resources:
  - namespace.yaml

  # MySQL databases
  - ../../base/databases/mysql-keycloak
  - ../../base/databases/mysql-user
  - ../../base/databases/mysql-product
  - ../../base/databases/mysql-order
  - ../../base/databases/mysql-payment
  - ../../base/databases/mysql-delivery

  # Microservices
  - ../../base/services/user-service
  - ../../base/services/product-service
  - ../../base/services/order-service
  - ../../base/services/payment-service
  - ../../base/services/delivery-service


  # Infrastructure
  - ../../base/kafka
  - ../../base/keycloak

  # Frontend and API Gateway
  - ../../base/angular-frontend
  - ../../base/api-gateway
  
  # Local HashiCorp Vault integration
  - ../../base/vault/local